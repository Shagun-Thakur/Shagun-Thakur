<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img" aria-label="Shagun Thakur, Machine Learning, Audio AI, Intelligent Systems">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE14D"/><stop offset="1" stop-color="#FFCB05"/></linearGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#B38A00" opacity=".25"/></pattern>
</defs>
<style>
  .tag{opacity:0;animation:cyc 9s infinite}
  @keyframes cyc{0%{opacity:0}5%{opacity:1}30%{opacity:1}35%{opacity:0}100%{opacity:0}}
  .fl{animation:fl 2.4s infinite}
  @keyframes fl{0%,100%{opacity:.55}45%{opacity:.55}50%{opacity:1}55%{opacity:.45}60%{opacity:1}}
  .fl2{animation:fl 2.4s infinite;animation-delay:1.1s}
</style>
<path d="M0,0 L1000,0 L1000,232 L960,262 L920,232 L880,262 L840,232 L800,262 L760,232 L720,262 L680,232 L640,262 L600,232 L560,262 L520,232 L480,262 L440,232 L400,262 L360,232 L320,262 L280,232 L240,262 L200,232 L160,262 L120,232 L80,262 L40,232 L0,262 L0,232 Z" fill="url(#bg)"/>
<path d="M0,0 L1000,0 L1000,232 L960,262 L920,232 L880,262 L840,232 L800,262 L760,232 L720,262 L680,232 L640,262 L600,232 L560,262 L520,232 L480,262 L440,232 L400,262 L360,232 L320,262 L280,232 L240,262 L200,232 L160,262 L120,232 L80,262 L40,232 L0,262 L0,232 Z" fill="url(#dots)"/>
<!-- large decorative bolts -->
<path d="M38,0 L4,56 L26,56 L16,100 L56,38 L32,38 Z" transform="translate(18,24) scale(1.7)" fill="#F2B705" class="fl"/>
<path d="M38,0 L4,56 L26,56 L16,100 L56,38 L32,38 Z" transform="translate(925,30) scale(1.5)" fill="#F2B705" class="fl2"/>
<!-- cheek accents -->
<circle cx="105" cy="190" r="20" fill="#E63946" opacity=".92"/>
<circle cx="895" cy="190" r="20" fill="#E63946" opacity=".92"/>
<!-- name -->
<text x="500" y="122" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="62" font-weight="800" fill="#0D1117" letter-spacing="1">Shagun Thakur</text>
<path d="M38,0 L4,56 L26,56 L16,100 L56,38 L32,38 Z" transform="translate(850,62) scale(0.75)" fill="#0D1117" />
<path d="M38,0 L4,56 L26,56 L16,100 L56,38 L32,38 Z" transform="translate(108,62) scale(0.75)" fill="#0D1117" />
<text x="500" y="164" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#0D1117">Machine Learning  ·  Audio AI  ·  Intelligent Systems</text>
<text x="500" y="212" text-anchor="middle" font-family="'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="18" font-weight="600" fill="#0D1117" class="tag" style="animation-delay:0s">Teaching machines to listen to the physical world</text><text x="500" y="212" text-anchor="middle" font-family="'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="18" font-weight="600" fill="#0D1117" class="tag" style="animation-delay:3s">Verifiable, hallucination-resistant AI</text><text x="500" y="212" text-anchor="middle" font-family="'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="18" font-weight="600" fill="#0D1117" class="tag" style="animation-delay:6s">Efficient systems on accessible hardware</text>
</svg>